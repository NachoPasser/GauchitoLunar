<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marco Visor de Placa Orbital Chill - El Sextante Polar</title>
<style>
  body {
    background-color: #05070e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 55px 35px;
    font-family: system-ui, -apple-system, sans-serif;
  }

  /* Contenedor principal: Chasis fino en grafito espacial (mismo radio 26px que Nobile Rim, sin azul) */
  .lightbox-frame-wrapper {
    position: relative;
    width: 100%;
    max-width: 680px;
    padding: 13px;
    background-color: #161a23;
    border: 1.5px solid #2e3545;
    border-radius: 26px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
    box-sizing: border-box;
    z-index: 2;
  }

  /* Contenedor interno de tu mapa (100% despejado, nada lo pisa) */
  .map-inner-card {
    position: relative;
    width: 100%;
    background-color: #0b0e17;
    border-radius: 16px;
    overflow: hidden;
    z-index: 5; /* Por encima del SVG para garantizar que NADA tape el mapa */
    display: flex;
    flex-direction: column;
  }

  /* Cabecera blanca limpia */
  .map-header {
    background: #ffffff;
    padding: 14px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    color: #12151e;
    font-size: 14px;
  }

  .map-header h2 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.2px;
  }

  .legend {
    display: flex;
    gap: 14px;
    align-items: center;
    color: #5a6275;
    font-size: 13px;
  }

  /* Viewport de tu mapa (reemplazar por tu div/canvas real) */
  .map-viewport {
    width: 100%;
    aspect-ratio: 1 / 1.05;
    background: radial-gradient(circle at center, #3b3f4a 0%, #161a24 65%, #0c0f17 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    color: rgba(255,255,255,0.45);
    font-size: 14px;
    position: relative;
  }

  /* Capa SVG estrictamente exterior (z-index menor al mapa, nunca lo pisa) */
  .svg-lightbox-hardware {
    position: absolute;
    inset: -34px;
    width: calc(100% + 68px);
    height: calc(100% + 68px);
    pointer-events: none;
    z-index: 3;
  }
</style>
</head>
<body>

<div class="lightbox-frame-wrapper">

  <!-- CAPA SVG EXTERIOR: Visor de Placa Orbital (cero elementos sobre el mapa) -->
  <svg class="svg-lightbox-hardware" viewBox="0 0 748 808" preserveAspectRatio="none">

    <!-- Puntitos estelares sutiles en el fondo negro (cohesión con Nobile Rim) -->
    <g fill="#ffffff" opacity="0.35">
      <circle cx="240" cy="14"  r="1.4"/>
      <circle cx="734" cy="210" r="1.5"/>
      <circle cx="14"  cy="490" r="1.4"/>
      <circle cx="520" cy="794" r="1.3"/>
    </g>

    <!-- Rayitas rojas de estado en esquinas superiores del chasis (mismo detalle que Nobile Rim) -->
    <line x1="58"  y1="40" x2="70"  y2="40" stroke="#e63946" stroke-width="2" stroke-linecap="round"/>
    <line x1="678" y1="40" x2="690" y2="40" stroke="#e63946" stroke-width="2" stroke-linecap="round"/>

    <!-- =====================================================================
         1. ARRIBA A LA IZQUIERDA: SOLAPA DE ARCHIVO DE PLACA (Tipo ficha NASA)
         ===================================================================== -->
    <g transform="translate(88, 34)">
      <!-- Solapa trapezoidal limpia que sobresale hacia arriba -->
      <path d="M 0,0 L 8,-14 L 112,-14 L 120,0 Z" fill="#161a23" stroke="#64748b" stroke-width="1.3" stroke-linejoin="round"/>
      <!-- Indicador rojo activo + etiqueta clara -->
      <circle cx="20" cy="-7" r="2" fill="#e63946"/>
      <text x="28" y="-4" fill="#cbd5e1" font-size="8.5" font-family="monospace" font-weight="bold" letter-spacing="1">POLO SUR LUNAR</text>
    </g>

    <!-- =====================================================================
         2. ARRIBA A LA DERECHA: LENTE DE INSPECCIÓN SOBRE RIEL EXTERIOR
         ===================================================================== -->
    <g transform="translate(615, 34)">
      <!-- Riel fino horizontal apoyado en el borde superior -->
      <line x1="-35" y1="-5" x2="35" y2="-5" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="-35" cy="-5" r="1.8" fill="#64748b"/>
      <circle cx="35"  cy="-5" r="1.8" fill="#64748b"/>
      
      <!-- Aro de lupa / visor óptico asomando por encima del riel -->
      <g transform="translate(8, -12)">
        <circle cx="0" cy="0" r="11" fill="#0b0e17" stroke="#cbd5e1" stroke-width="1.4"/>
        <circle cx="0" cy="0" r="7.5" fill="none" stroke="#475569" stroke-width="1"/>
        <!-- Reflejo sutil de vidrio -->
        <path d="M -4,-3 A 5,5 0 0,1 2,-5" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
        <!-- Mango corto que conecta al chasis -->
        <line x1="0" y1="11" x2="0" y2="14" stroke="#e63946" stroke-width="2"/>
      </g>
    </g>

    <!-- =====================================================================
         3. FLANCO DERECHO: RUEDA MOLETEADA DE ENFOQUE / ZOOM (Dial lateral)
         ===================================================================== -->
    <g transform="translate(714, 395)">
      <!-- Cuerpo semicilíndrico del dial que asoma por fuera del borde derecho -->
      <rect x="0" y="-26" width="11" height="52" rx="3" fill="#1e2433" stroke="#94a3b8" stroke-width="1.3"/>
      <!-- Ranuras horizontales de agarre (moleteado) -->
      <g stroke="#64748b" stroke-width="1.2" stroke-linecap="round">
        <line x1="2" y1="-18" x2="9" y2="-18"/>
        <line x1="2" y1="-12" x2="9" y2="-12"/>
        <line x1="2" y1="-6"  x2="9" y2="-6"/>
        <line x1="2" y1="0"   x2="9" y2="0" stroke="#e63946" stroke-width="1.6"/>
        <line x1="2" y1="6"   x2="9" y2="6"/>
        <line x1="2" y1="12"  x2="9" y2="12"/>
        <line x1="2" y1="18"  x2="9" y2="18"/>
      </g>
    </g>

    <!-- =====================================================================
         4. FLANCO IZQUIERDO: INTERRUPTOR / SELECTOR DE CAPA LATERAL
         ===================================================================== -->
    <g transform="translate(34, 395)">
      <rect x="-8" y="-16" width="8" height="32" rx="2.5" fill="#161a23" stroke="#64748b" stroke-width="1.2"/>
      <circle cx="-4" cy="-7" r="2" fill="#e63946"/>
      <circle cx="-4" cy="7"  r="2" fill="#475569"/>
    </g>

    <!-- =====================================================================
         5. BASE INFERIOR: CLIPS DE SUJECIÓN DE MESA DE LUZ (Cero patas de nave)
         ===================================================================== -->
    <!-- Clip izquierdo -->
    <g transform="translate(115, 774)">
      <path d="M -18,0 L -14,9 L 14,9 L 18,0" fill="#161a23" stroke="#64748b" stroke-width="1.3" stroke-linejoin="round"/>
      <line x1="-8" y1="4.5" x2="8" y2="4.5" stroke="#94a3b8" stroke-width="1.2"/>
    </g>

    <!-- Clip derecho -->
    <g transform="translate(633, 774)">
      <path d="M -18,0 L -14,9 L 14,9 L 18,0" fill="#161a23" stroke="#64748b" stroke-width="1.3" stroke-linejoin="round"/>
      <line x1="-8" y1="4.5" x2="8" y2="4.5" stroke="#94a3b8" stroke-width="1.2"/>
    </g>

    <!-- Luz piloto central inferior -->
    <g transform="translate(374, 774)">
      <rect x="-16" y="0" width="32" height="7" rx="2" fill="#161a23" stroke="#475569" stroke-width="1.2"/>
      <line x1="-8" y1="3.5" x2="8" y2="3.5" stroke="#e63946" stroke-width="1.8" stroke-linecap="round"/>
    </g>

  </svg>

  <!-- CONTENIDO INTERNO (TU MAPA DEL POLO SUR - 100% LIBRE) -->
  <div class="map-inner-card">
    <div class="map-viewport" id="tu-contenedor-mapa">
      [ Contenedor del Mapa del Polo Sur ]
    </div>
  </div>

</div>

</body>
</html>
