<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa polar sur · Lunar Landing Site Navigator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <!--
    Hub del mapa polar (H3). Requiere el backend corriendo:
        cd backend && .venv/bin/uvicorn main:app --reload
    y servir este frontend por HTTP (no file://, por CORS):
        cd frontend && python3 -m http.server 5500   → http://localhost:5500/map.html
  -->
</head>
<body class="bg-slate-950 min-h-screen text-slate-100 font-['Inter']">

  <!-- Encabezado -->
  <header class="px-6 pt-5 pb-2">
    <h1 class="text-lg font-bold">¿Dónde aterrizar en el polo sur lunar?</h1>
    <p class="text-sm text-slate-400">
      Tocá un sitio para ver su cielo y sus métricas.
      <span class="text-slate-500">~83°S–90°S · ~300 km de lado · fondo = luz promedio</span>
    </p>
  </header>

  <!-- Lienzo del mapa (cuadrado, centrado) -->
  <main class="flex items-center justify-center p-4">
    <div id="map-stage"
         class="relative aspect-square bg-slate-900 rounded-xl overflow-hidden
                shadow-2xl ring-1 ring-white/10"
         style="width: min(88vmin, 820px);">
      <img id="map-bg" alt="Mapa de luz promedio del polo sur lunar"
           class="absolute inset-0 w-full h-full object-cover select-none" draggable="false" />
      <!-- Capas de chrome (anillos/escala) y marcadores se dibujan en JS -->
      <svg id="map-chrome" class="absolute inset-0 w-full h-full pointer-events-none"
           viewBox="0 0 1000 1000" preserveAspectRatio="none"
           style="filter: drop-shadow(0 0 1.5px rgba(0,0,0,.9));"></svg>
      <div id="map-markers" class="absolute inset-0"></div>

      <!-- Botón flotante al clickear zona libre -->
      <div id="free-popup"
           class="absolute z-20 hidden -translate-x-1/2 -translate-y-full
                  bg-white text-slate-800 rounded-lg shadow-xl text-xs overflow-hidden">
        <button id="free-add" class="block w-full px-3 py-2 text-left hover:bg-slate-100">
          📍 Agregar este sitio
        </button>
        <button id="free-detail"
                class="block w-full px-3 py-2 text-left hover:bg-slate-100 border-t border-slate-100">
          🔭 Ver detalle acá
        </button>
      </div>

      <p id="map-status"
         class="absolute left-2 bottom-2 text-[11px] text-slate-400 font-['JetBrains_Mono']"></p>
    </div>
  </main>

  <!-- MODAL DE DETALLE PUNTUAL (compartido con H2, ids idénticos) -->
  <div id="detail-overlay"
       class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 hidden z-40">
    <div id="detail-panel"
         class="bg-white text-slate-800 rounded-2xl shadow-2xl w-full max-w-3xl
                max-h-[92vh] overflow-auto">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
        <div>
          <h2 id="site-name" class="text-lg font-bold text-slate-800">—</h2>
          <p id="site-coords" class="text-xs text-slate-400 font-['JetBrains_Mono']"></p>
        </div>
        <button id="close-btn"
                class="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-500 text-xl leading-none">
          ×
        </button>
      </div>
      <div class="flex flex-wrap items-center gap-3 px-6 pt-4">
        <button id="fullsky-btn"
                class="text-xs px-2.5 py-1 rounded border border-slate-200 text-slate-600 hover:bg-slate-50">
          Cielo completo (0–90°)
        </button>
        <span id="status" class="text-xs text-slate-400"></span>
      </div>
      <div class="px-4 py-3">
        <svg id="skyline" class="w-full" role="img"
             aria-label="Skyline: elevación del Sol y la Tierra sobre el horizonte"></svg>
      </div>
      <div class="px-6 pb-1">
        <input id="time-slider" type="range" min="0" max="0" value="0"
               class="w-full accent-[#0032A0]" aria-label="Instante dentro de la ventana" />
        <p id="time-label" class="text-xs text-slate-500 font-['JetBrains_Mono'] mt-1"></p>
      </div>
      <div id="metrics" class="px-6"></div>
      <div id="cartuchos" class="px-6 pb-6"></div>
    </div>
  </div>

  <script src="apibase.js"></script>
  <script type="module" src="map.js"></script>
</body>
</html>
